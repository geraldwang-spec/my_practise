<!doctype html>
<html lang="zh-Hant">

<head>
  <meta charset="utf-8">
  <title>XPath 練習頁</title>
</head>

<body>

  <!-- h1 -->
  <h1>my store</h1>

  <hr>

  <!-- 多個 a（測 //a/text()） -->
  <nav>
    <a href="/news">News</a>
    <a href="/products">Products</a>
    <a href="/contact">Contact</a>
  </nav>

  <hr>

  <!-- class 練習 -->
  <p class="logo">用標籤找資料</p>

  <hr>

  <!-- id 練習 -->
  <header id="site-header">
    <h2>Header 區塊</h2>
    <a href="/inside">Inside Link</a>
  </header>

</body>

</html>
