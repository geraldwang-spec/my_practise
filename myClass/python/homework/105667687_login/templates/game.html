<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <title>CodePen - Game Form</title>

  <style>
    @import url(http://fonts.googleapis.com/css?family=Exo:100,200,400);
    @import url(http://fonts.googleapis.com/css?family=Source+Sans+Pro:700,400,300);

    body {
      margin: 0;
      padding: 0;
      background: #fff;

      color: #fff;
      font-family: Arial;
      font-size: 12px;
    }

    .body {
      position: absolute;
      top: -20px;
      left: -20px;
      right: -40px;
      bottom: -40px;
      width: auto;
      height: auto;
      background-image: url(https://static.vecteezy.com/system/resources/thumbnails/007/164/537/small/fingerprint-identity-sensor-data-protection-system-podium-hologram-blue-light-and-concept-free-vector.jpg);
      background-size: cover;
      -webkit-filter: blur(5px);
      z-index: 0;
    }

    .grad {
      position: absolute;
      top: -20px;
      left: -20px;
      right: -40px;
      bottom: -40px;
      width: auto;
      height: auto;
      background: -webkit-gradient(linear, left top, left bottom, color-stop(0%, rgba(0, 0, 0, 0)), color-stop(100%, rgba(0, 0, 0, 0.65)));
      /* Chrome,Safari4+ */
      z-index: 1;
      opacity: 0.7;
    }

    .container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 10;
    }

    .header {
      position: absolute;
      top: calc(50% - 35px);
      left: calc(50% - 255px);
      z-index: 2;
    }

    .header div {
      float: left;
      color: #fff;
      font-family: 'Exo', sans-serif;
      font-size: 35px;
      font-weight: 200;
    }

    .header div span {
      color: #5379fa !important;
    }

    .login {
      position: absolute;
      top: calc(50% - 75px);
      left: calc(50% - 50px);
      height: 150px;
      width: 350px;
      padding: 10px;
      z-index: 2;
    }

    .login input[type=text] {
      width: 250px;
      height: 30px;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 2px;
      color: #fff;
      font-family: 'Exo', sans-serif;
      font-size: 16px;
      font-weight: 400;
      padding: 4px;
    }

    .login input[type=password] {
      width: 250px;
      height: 30px;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 2px;
      color: #fff;
      font-family: 'Exo', sans-serif;
      font-size: 16px;
      font-weight: 400;
      padding: 4px;
      margin-top: 10px;
    }

    .login input[type=button] {
      width: 260px;
      height: 35px;
      background: #fff;
      border: 1px solid #fff;
      cursor: pointer;
      border-radius: 2px;
      color: #a18d6c;
      font-family: 'Exo', sans-serif;
      font-size: 16px;
      font-weight: 400;
      padding: 6px;
      margin-top: 10px;
    }

    .login input[type=button]:hover {
      opacity: 0.8;
    }

    .login input[type=button]:active {
      opacity: 0.6;
    }

    .login input[type=text]:focus {
      outline: none;
      border: 1px solid rgba(255, 255, 255, 0.9);
    }

    .login input[type=password]:focus {
      outline: none;
      border: 1px solid rgba(255, 255, 255, 0.9);
    }

    .login input[type=button]:focus {
      outline: none;
    }

    ::-webkit-input-placeholder {
      color: rgba(255, 255, 255, 0.6);
    }

    ::-moz-input-placeholder {
      color: rgba(255, 255, 255, 0.6);
    }

    .result-box {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 10;
      margin-top: 20px;
      padding: 15px;
      border: 2px solid #000;
      background: rgba(255.255, 255, 0.8);
    }
  </style>

  <script src="static/js/prefixfree.min.js"></script>

</head>

<body>

  <div class="body"></div>
  <div class="grad"></div>
  <div class="container">
    <h1>使用者: {{ user }}</h1>
    <a href="/game?choice=paper" name="paper">
      <img src="static/paper.png" alt="">
    </a>
    <a href="/game?choice=scissors" name="scissors">
      <img src="static/scissors.png" alt="">
    </a>
    <a href="/game?choice=stone" name="stone">
      <img src="static/stone.png" alt="">
    </a>
    <h3>遊戲結果</h3>
    {% if user_choice %}
    <p>你的選譯
      {% if user_choice == 'paper' %}
      <img src="static/paper.png" alt="">vs
      {% elif user_choice == 'scissors' %}
      <img src="static/scissors.png" alt="">
      {% else %}
      <img src="static/stone.png" alt="">
      {% endif %}
    </p>

    <p>電腦選擇
      {% if computer_choice == 'paper' %}
      <img src="static/paper.png" alt="">vs
      {% elif computer_choice == 'scissors' %}
      <img src="static/scissors.png" alt="">
      {% else %}
      <img src="static/stone.png" alt="">
      {% endif %}
    </p>
    {% endif %}

  </div>



  <script src='http://codepen.io/assets/libs/fullpage/jquery.js'></script>

</body>

</html>
