<!DOCTYPE html>
<html>
  <head>
    <title>Image</title>
  </head>
  <body>
    <a href="../index.html">
      <img src="smiley.gif" alt="Back" style="width:43px;height:43px;">
    </a>
    <br>
    <h1>Image Map(rect, circle)</h1>
    <img src="https://www.w3schools.com/html/workplace.jpg" alt="w3c test" usemap="#workmap">
    <br>
    <map name="workmap">
      <area shape="rect" coords="34,44,270,350" alt="Computer" href="https://www.w3schools.com/html/computer.htm">
      <area shape="rect" coords="290,172,333,250" alt="Phone" href="https://www.w3schools.com/html/phone.htm">
      <area shape="circle" coords="337,300,44" alt="Coffee" href="https://www.w3schools.com/html/coffee.htm">
    </map>
    <img src="https://www.w3schools.com/html/frenchfood.jpg" alt="w3c test2" usemap="#workmap2">
    <br>
    <h1>Image Map (Poly)</h1>
    <map name="workmap2">
      <area shape="poly" coords="140,121,181,116,204,160,204,222,191,270,140,329,85,355,58,352,37,322,40,259,103,161,128,147" 
      href="./corissant.html" alt="qoo">
    </map>
    <img src="https://www.w3schools.com/html/workplace.jpg" alt="w3c test" usemap="#workmap3">
    <map name="workmap3">
      <area shape="circle" coords="337,300,44" alt="Coffee" 
      href="https://www.w3schools.com/html/coffee.htm"
      onclick="myFunction()">
    </map>
    <script>
      function myFunction(){
        alert("You clicked the coffee cup!");
      }
    </script>
  </body>
</html>
