<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <!-- <link href="css/style.css" rel="stylesheet"> -->
  <style>
    .box {
      width: 200px;
      margin: auto;
    }

    .box h2 {
      text-align: center;
    }

    .box input {
      font-size: 18px;
      padding: 0.2em;
      margin: 0.2em;
    }

    .box button {
      font-size: 18px;
    }
  </style>
</head>

<body>

</body>
<div class="box">
  <h2>BMI detector</h2>
  <input id="heigh" type="text" name="" value="" placeholder="請輸入身高(cm)" maxlength="3">
  <input id="weight" type="text" name="" value="" placeholder="請輸入體重(kg)" maxlength="3">
  <button type="button" id="btn">Click</button>
  <h3 id="ends"></h3>

</div>

</html>

<script>
  let btn = document.getElementById("btn");
  btn.addEventListener("click", function () {
    let h = document.getElementById("heigh");
    let w = document.getElementById("weight");
    let bmi = Math.round((w.value / (h.value / 100) ** 2) * 10) / 10;
    let h3 = document.getElementById("ends");

    h3.style.color = "black";
    if (bmi == Infinity || isNaN(bmi) || bmi == 0) {
      h3.textContent = "輸入鍣誤！笨蛋";
      h3.style.color = "red";
    } else if (bmi < 18) {
      h3.textContent = "BMI : " + bmi + " 過輕";
      h3.style.color = "green";
    } else if (bmi < 24) {
      h3.textContent = "BMI : " + bmi + " 標準";
    } else if (bmi < 27) {
      h3.textContent = "BMI : " + bmi + " 過重";
      h3.style.color = "blue";
    } else if (bmi < 30) {
      h3.textContent = "BMI : " + bmi + " 輕度肥胖";
      h3.style.color = "orange";
    } else if (bmi < 34) {
      h3.textContent = "BMI : " + bmi + " 中度肥胖";
      h3.style.color = "red";
    } else {
      h3.textContent = "BMI : " + bmi + " 重度肥胖";
      h3.style.color = "darkred";
    }

    h.value = "";
    w.value = "";

  });
</script>
