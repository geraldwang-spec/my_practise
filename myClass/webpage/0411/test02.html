<script>
  let h = 170;
  let w = 80;
  let bmi = w / (h / 100) ** 2;
  console.log(bmi);
  if (bmi < 18) {
    console.log("過輕");
  } else if (bmi < 24) {
    console.log("標準");
  } else if (bmi < 27) {
    console.log("過重");
  } else if (bmi < 30) {
    console.log("輕度肥胖");
  } else if (bmi < 34) {
    console.log("中度肥胖");
  } else {
    console.log("重度肥胖");
  }
</script>
