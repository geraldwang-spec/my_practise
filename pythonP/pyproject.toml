[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pythonP"
version = "0.1.0"
dependencies = [
  "ipython",
  "ipykernel",
  "pynvim",
  "jupytext",
]
requires-python = ">=3.10"

[tool.setuptools]
# 關鍵：告訴工具去 src 資料夾找代碼
package-dir = {"" = "src"}

[tool.pytest.ini_options]
include = ["src", "tests"]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.pyright]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"

[tool.fastapi]
entrypoint = "src.pythonP.mytest.fastapi_test:app"

[project.optional-dependencies]
datasci = [
  "numpy", 
  "scipy", 
  "pandas", 
  "polars", 
  "matplotlib", 
  "matplotlib-stubs",
  "seaborn", 
  "plotly", 
  "cairosvg",
]
ml = [
  "scikit-learn", 
  "xgboost", 
  "lightgbm",
]
dl = [
  "torch", 
  "torchvision", 
  "torchaudio",
]
dev = [
  "ruff", 
  "basedpyright", 
  "pytest",
]
dist = [
  "pyinstaller",
]
math = [
  "scipy",
  "scipy-stubs"
]
web = [
  "fastapi",
  "fastapi-cli",
  "uvicorn",
  "requests", 
]
ui = [
  "selenium"
]


