<!DOCTYPE html>
<html lang="zh-HK">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>小朋友齊打字</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@600;700;800;900&display=swap"
    rel="stylesheet">
  <style>
    /* ══ RESET & BASE ══ */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: hsl(195, 85%, 95%);
      --fg: hsl(220, 50%, 20%);
      --primary: hsl(335, 85%, 60%);
      --primary-dk: hsl(335, 85%, 45%);
      --secondary: hsl(45, 100%, 55%);
      --secondary-dk: hsl(45, 100%, 40%);
      --accent: hsl(270, 80%, 65%);
      --accent-dk: hsl(270, 80%, 50%);
      --success: hsl(145, 75%, 45%);
      --success-dk: hsl(145, 75%, 32%);
      --danger: hsl(350, 85%, 60%);
      --danger-dk: hsl(350, 85%, 45%);
      --muted: hsl(210, 40%, 90%);
      --muted-fg: hsl(215, 25%, 45%);
      --white: #ffffff;
      --font-display: 'Fredoka One', cursive;
      --font-body: 'Nunito', sans-serif;
    }

    body {
      font-family: var(--font-body);
      font-weight: 700;
      min-height: 100vh;
      background-color: var(--bg);
      background-image:
        url('images/game-bg.png'),
        radial-gradient(circle at 15% 50%, rgba(255, 255, 255, .4) 0%, transparent 25%),
        radial-gradient(circle at 85% 30%, rgba(255, 255, 255, .4) 0%, transparent 25%);
      background-size: cover, auto, auto;
      background-position: center, left, right;
      background-repeat: no-repeat, no-repeat, no-repeat;
      background-blend-mode: luminosity, normal, normal;
      color: var(--fg);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 40px;
      overflow-x: hidden;
    }

    /* ── HEADER ── */
    .site-header {
      display: flex;
      align-items: center;
      gap: 14px;
      background: rgba(255, 255, 255, .85);
      backdrop-filter: blur(12px);
      padding: 10px 28px;
      border-radius: 100px;
      border: 4px solid rgba(255, 255, 255, .9);
      box-shadow: 0 8px 24px rgba(0, 0, 0, .12);
      margin-bottom: 32px;
      animation: dropIn .6s cubic-bezier(.34, 1.56, .64, 1) both;
    }

    @keyframes dropIn {
      from {
        opacity: 0;
        transform: translateY(-40px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .site-header img {
      width: 52px;
      height: 52px;
      object-fit: contain;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, .2));
    }

    .site-header h1 {
      font-family: var(--font-display);
      font-size: 2rem;
      color: var(--primary);
      letter-spacing: .12em;
      text-shadow: 0 2px 4px rgba(0, 0, 0, .1);
    }

    /* ── SCREENS ── */
    .screen {
      display: none;
      width: 100%;
      max-width: 520px;
    }

    .screen.active {
      display: block;
      animation: fadeUp .35s ease both;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(24px) scale(.97);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* ── CARD ── */
    .card {
      background: rgba(255, 255, 255, .92);
      backdrop-filter: blur(16px);
      border-radius: 40px;
      border: 8px solid rgba(255, 255, 255, .8);
      padding: 36px 28px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, .18);
      position: relative;
    }

    /* ── TYPOGRAPHY ── */
    .card-title {
      font-family: var(--font-display);
      font-size: 1.6rem;
      text-align: center;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--fg);
      margin-bottom: 8px;
    }

    label {
      display: block;
      font-family: var(--font-display);
      font-size: 1.3rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      text-align: center;
      color: var(--fg);
      margin-bottom: 12px;
    }

    /* ── TEXT INPUT ── */
    input[type="text"] {
      width: 100%;
      text-align: center;
      font-family: var(--font-body);
      font-size: 1.6rem;
      font-weight: 800;
      padding: 16px 20px;
      border-radius: 18px;
      border: 4px solid transparent;
      background: hsl(210, 40%, 93%);
      color: var(--fg);
      outline: none;
      transition: border-color .2s, background .2s;
      margin-bottom: 24px;
    }

    input[type="text"]:focus {
      border-color: var(--primary);
      background: white;
    }

    input[type="text"]::placeholder {
      color: hsl(215, 25%, 65%);
    }

    /* ── LEVEL BUTTONS ── */
    .level-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 28px;
    }

    .level-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px 8px;
      border-radius: 20px;
      border: 4px solid hsl(220, 30%, 88%);
      background: white;
      cursor: pointer;
      transition: transform .15s, border-color .15s, background .15s;
      font-family: var(--font-body);
      font-weight: 800;
      color: var(--fg);
      gap: 6px;
    }

    .level-btn .lv-emoji {
      font-size: 2.4rem;
      line-height: 1;
    }

    .level-btn .lv-name {
      font-size: 1rem;
    }

    .level-btn.selected-easy {
      background: hsl(142, 69%, 58%);
      border-color: rgba(0, 0, 0, .1);
      color: white;
      transform: scale(1.06);
    }

    .level-btn.selected-medium {
      background: hsl(45, 100%, 55%);
      border-color: rgba(0, 0, 0, .1);
      color: hsl(30, 80%, 20%);
      transform: scale(1.06);
    }

    .level-btn.selected-hard {
      background: hsl(0, 84%, 60%);
      border-color: rgba(0, 0, 0, .1);
      color: white;
      transform: scale(1.06);
    }

    /* ── 3D BUTTONS ── */
    .btn-3d {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 20px 24px;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      font-family: var(--font-display);
      font-size: 1.5rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      transition: transform .08s, box-shadow .08s;
      text-shadow: 0 2px 4px rgba(0, 0, 0, .15);
    }

    .btn-3d:active {
      transform: translateY(5px);
    }

    .btn-pink {
      background: var(--primary);
      color: white;
      box-shadow: 0 7px 0 var(--primary-dk);
    }

    .btn-pink:active {
      box-shadow: 0 2px 0 var(--primary-dk);
    }

    .btn-yellow {
      background: var(--secondary);
      color: hsl(30, 80%, 20%);
      box-shadow: 0 7px 0 var(--secondary-dk);
    }

    .btn-yellow:active {
      box-shadow: 0 2px 0 var(--secondary-dk);
    }

    .btn-purple {
      background: var(--accent);
      color: white;
      box-shadow: 0 7px 0 var(--accent-dk);
    }

    .btn-purple:active {
      box-shadow: 0 2px 0 var(--accent-dk);
    }

    .btn-green {
      background: var(--success);
      color: white;
      box-shadow: 0 7px 0 var(--success-dk);
    }

    .btn-green:active {
      box-shadow: 0 2px 0 var(--success-dk);
    }

    .btn-sm {
      padding: 14px 20px;
      font-size: 1.2rem;
      margin-top: 12px;
    }

    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 12px;
    }

    /* ── DECORATIVE FLOATERS ── */
    .floater {
      position: absolute;
      font-size: 3.5rem;
      pointer-events: none;
      animation: floatBob 3s ease-in-out infinite;
    }

    .floater-tl {
      top: -20px;
      left: -20px;
      transform: rotate(-15deg);
      animation-delay: 0s;
    }

    .floater-br {
      bottom: -20px;
      right: -20px;
      transform: rotate(15deg);
      animation-delay: 1s;
    }

    @keyframes floatBob {

      0%,
      100% {
        transform: translateY(0) rotate(-15deg);
      }

      50% {
        transform: translateY(-8px) rotate(-15deg);
      }
    }

    .floater-br {
      animation-name: floatBobR;
    }

    @keyframes floatBobR {

      0%,
      100% {
        transform: translateY(0) rotate(15deg);
      }

      50% {
        transform: translateY(-8px) rotate(15deg);
      }
    }

    /* ── HUD (game screen) ── */
    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, .2);
      backdrop-filter: blur(8px);
      border-radius: 20px;
      padding: 12px 20px;
      margin-bottom: 10px;
    }

    .hud-score,
    .hud-timer {
      font-family: var(--font-display);
      font-size: 1.8rem;
      color: var(--fg);
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, .75);
      padding: 8px 20px;
      border-radius: 100px;
      border: 3px solid rgba(255, 255, 255, .6);
    }

    .hud-timer.low {
      color: var(--danger);
      animation: pulseRed 1s infinite;
    }

    @keyframes pulseRed {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: .55
      }
    }

    /* ── PROGRESS BAR ── */
    .progress-wrap {
      background: rgba(255, 255, 255, .4);
      border-radius: 100px;
      height: 14px;
      margin-bottom: 14px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: var(--secondary);
      border-radius: 100px;
      transition: width 1s linear, background .3s;
    }

    .progress-bar.low {
      background: var(--danger);
    }

    /* ── GAME CARD ── */
    .game-card {
      background: rgba(255, 255, 255, .93);
      backdrop-filter: blur(16px);
      border-radius: 48px;
      border: 8px solid white;
      padding: 28px 20px 24px;
      box-shadow: 0 20px 56px rgba(0, 0, 0, .18);
      text-align: center;
      position: relative;
      transition: border-color .18s, background .18s;
    }

    .game-card.anim-success {
      border-color: var(--success);
      background: hsl(145, 75%, 97%);
      animation: gameBounce .38s ease;
    }

    .game-card.anim-error {
      border-color: var(--danger);
      background: hsl(350, 85%, 97%);
      animation: gameShake .38s ease;
    }

    @keyframes gameBounce {

      0%,
      100% {
        transform: scale(1)
      }

      50% {
        transform: scale(1.04)
      }
    }

    @keyframes gameShake {

      0%,
      100% {
        transform: translateX(0)
      }

      20% {
        transform: translateX(-10px)
      }

      40% {
        transform: translateX(10px)
      }

      60% {
        transform: translateX(-6px)
      }

      80% {
        transform: translateX(6px)
      }
    }

    .hint-badge {
      position: absolute;
      top: 14px;
      left: 16px;
      font-size: .9rem;
      font-weight: 800;
      color: var(--muted-fg);
      background: var(--muted);
      padding: 5px 14px;
      border-radius: 100px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .emoji-display {
      font-size: 7rem;
      line-height: 1;
      margin: 16px 0 20px;
      user-select: none;
    }

    /* ── LETTER BOXES ── */
    .letters {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      margin-bottom: 20px;
    }

    .letter-box {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      text-transform: uppercase;
      border-radius: 16px;
      border-bottom: 6px solid hsl(220, 30%, 82%);
      background: var(--muted);
      color: var(--muted-fg);
      transition: background .12s, color .12s, transform .12s, border-color .12s;
    }

    .letter-box.correct {
      background: var(--success);
      color: white;
      border-color: var(--success-dk);
      transform: scale(1.1) rotate(-2deg);
    }

    .letter-box.wrong {
      background: var(--danger);
      color: white;
      border-color: var(--danger-dk);
    }

    /* dynamic size classes */
    .sz-lg {
      width: 70px;
      height: 84px;
      font-size: 2.4rem;
    }

    .sz-md {
      width: 56px;
      height: 68px;
      font-size: 1.9rem;
    }

    .sz-sm {
      width: 46px;
      height: 56px;
      font-size: 1.5rem;
    }

    .sz-xs {
      width: 38px;
      height: 48px;
      font-size: 1.2rem;
    }

    .type-hint {
      color: var(--muted-fg);
      font-size: 1rem;
      font-weight: 700;
    }

    /* hidden real input */
    #hidden-input {
      position: absolute;
      opacity: 0;
      width: 1px;
      height: 1px;
      pointer-events: none;
    }

    /* ── RESULTS ── */
    .trophy-icon {
      position: absolute;
      top: -56px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--secondary);
      width: 90px;
      height: 90px;
      border-radius: 50%;
      border: 8px solid white;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .18);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.6rem;
    }

    .results-card {
      padding-top: 54px;
    }

    .score-wrap {
      background: hsl(210, 40%, 93%);
      border-radius: 28px;
      border: 4px solid var(--muted);
      padding: 24px;
      margin: 20px 0 24px;
    }

    .score-label {
      font-family: var(--font-display);
      font-size: 1rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--muted-fg);
      margin-bottom: 8px;
    }

    .score-big {
      font-family: var(--font-display);
      font-size: 5rem;
      color: var(--secondary);
      text-shadow: 2px 2px 0 rgba(0, 0, 0, .12), 0 8px 0 var(--secondary-dk);
    }

    /* ── LEADERBOARD ── */
    .lb-heading {
      font-family: var(--font-display);
      font-size: 1.6rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 20px;
      color: var(--fg);
    }

    .lb-list {
      list-style: none;
      margin-bottom: 20px;
    }

    .lb-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-radius: 16px;
      margin-bottom: 8px;
      background: hsl(210, 40%, 94%);
      font-weight: 800;
    }

    .lb-item:nth-child(1) {
      background: hsl(48, 100%, 90%);
    }

    .lb-item:nth-child(2) {
      background: hsl(220, 20%, 92%);
    }

    .lb-item:nth-child(3) {
      background: hsl(30, 80%, 90%);
    }

    .lb-rank {
      font-family: var(--font-display);
      font-size: 1.3rem;
      width: 36px;
      text-align: center;
    }

    .lb-name {
      flex: 1;
      font-size: 1rem;
      color: var(--fg);
    }

    .lb-level {
      font-size: .8rem;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 100px;
    }

    .lv-easy {
      background: hsl(142, 50%, 85%);
      color: hsl(142, 60%, 25%);
    }

    .lv-medium {
      background: hsl(45, 100%, 85%);
      color: hsl(30, 80%, 25%);
    }

    .lv-hard {
      background: hsl(0, 70%, 88%);
      color: hsl(0, 70%, 30%);
    }

    .lb-score {
      font-family: var(--font-display);
      font-size: 1.1rem;
      color: var(--primary);
    }

    .loading-text {
      text-align: center;
      color: var(--muted-fg);
      padding: 20px 0;
      font-size: 1rem;
    }

    /* ── CONFETTI ── */
    .confetti-piece {
      position: fixed;
      width: 10px;
      height: 14px;
      border-radius: 3px;
      pointer-events: none;
      animation: confettiFall 1.4s ease-in forwards;
    }

    @keyframes confettiFall {
      0% {
        transform: translateY(-20px) rotate(0deg);
        opacity: 1;
      }

      100% {
        transform: translateY(105vh) rotate(720deg);
        opacity: 0;
      }
    }

    /* ── UTILS ── */
    .mt-8 {
      margin-top: 8px;
    }

    .mt-16 {
      margin-top: 16px;
    }

    .mt-56 {
      margin-top: 56px;
    }

    .section-space {
      margin-bottom: 24px;
    }
  </style>
</head>

<body>

  <!-- ── HEADER ── -->
  <header class="site-header">
    <img src="images/mascot.png" alt="Mascot" onerror="this.style.display='none'">
    <h1>ssss小朋友齊打</h1>
  </header>

  <!-- ══ HOME ══ -->
  <div id="screen-home" class="screen active">
    <div class="card">
      <span class="floater floater-tl">🌟</span>
      <span class="floater floater-br">🚀</span>

      <div class="section-space">
        <label for="player-name">Who is playing? 誰在玩？</label>
        <input type="text" id="player-name" placeholder="Your Name 你的名字" maxlength="12" />
        <div id="name-error"
          style="color:var(--danger);text-align:center;font-weight:800;margin-top:-16px;margin-bottom:12px;min-height:22px;">
        </div>
      </div>

      <div class="section-space">
        <label>Choose Level 選擇難度</label>
        <div class="level-grid">
          <button class="level-btn selected-easy" data-level="easy">
            <span class="lv-emoji">🐣</span>
            <span class="lv-name">簡單 Easy</span>
          </button>
          <button class="level-btn" data-level="medium">
            <span class="lv-emoji">🦊</span>
            <span class="lv-name">中等 Medium</span>
          </button>
          <button class="level-btn" data-level="hard">
            <span class="lv-emoji">🦁</span>
            <span class="lv-name">困難 Hard</span>
          </button>
        </div>
      </div>

      <button class="btn-3d btn-pink" id="start-btn">▶ START GAME 開始</button>
      <button class="btn-3d btn-yellow btn-sm" id="view-lb-btn">⭐ LEADERBOARD 排行榜</button>
    </div>
  </div>

  <!-- ══ GAME ══ -->
  <div id="screen-game" class="screen" style="max-width:600px;">
    <div class="hud">
      <div class="hud-score">⭐ <span id="score-display">0</span></div>
      <div class="hud-timer" id="hud-timer">⏱ <span id="time-left">60</span>s</div>
    </div>
    <div class="progress-wrap">
      <div class="progress-bar" id="progress-bar" style="width:100%"></div>
    </div>
    <div class="game-card" id="game-card">
      <div class="hint-badge" id="hint-badge">🔊 <span id="hint-text"></span></div>
      <div class="emoji-display" id="emoji-display"></div>
      <div class="letters" id="letters"></div>
      <input id="hidden-input" type="text" autocomplete="off" autocorrect="off" autocapitalize="off"
        spellcheck="false" />
      <p class="type-hint">⌨️ Type the word! 打出這個字！</p>
    </div>
  </div>

  <!-- ══ RESULTS ══ -->
  <div id="screen-results" class="screen">
    <div class="card results-card">
      <div class="trophy-icon">🏆</div>
      <div class="card-title mt-8">Time's Up! 時間到!</div>
      <p style="text-align:center;color:var(--muted-fg);font-size:1.1rem;" id="results-name-msg"></p>
      <div class="score-wrap">
        <div class="score-label">Final Score 最終分數</div>
        <div class="score-big" id="final-score">0</div>
      </div>
      <button class="btn-3d btn-pink" id="play-again-btn">🔄 PLAY AGAIN 再玩一次</button>
      <div class="btn-grid mt-8">
        <button class="btn-3d btn-purple btn-sm" id="result-home-btn">🏠 HOME 主頁</button>
        <button class="btn-3d btn-yellow btn-sm" id="result-lb-btn">🏆 RANKS 排行榜</button>
      </div>
    </div>
  </div>

  <!-- ══ LEADERBOARD ══ -->
  <div id="screen-leaderboard" class="screen">
    <div class="card">
      <p class="lb-heading">🏆 Leaderboard 排行榜</p>
      <ul class="lb-list" id="lb-list">
        <li class="loading-text">載入中...</li>
      </ul>
      <button class="btn-3d btn-purple btn-sm" id="back-from-lb-btn">← BACK 返回</button>
    </div>
  </div>

  <script>
    // ═══ DATA ═══
    const WORDS = {
      easy: [
        {id: 'e1', word: 'cat', emoji: '🐱', hint: '貓'},
        {id: 'e2', word: 'dog', emoji: '🐶', hint: '狗'},
        {id: 'e3', word: 'sun', emoji: '☀️', hint: '太陽'},
        {id: 'e4', word: 'car', emoji: '🚗', hint: '車'},
        {id: 'e5', word: 'bus', emoji: '🚌', hint: '巴士'},
        {id: 'e6', word: 'pig', emoji: '🐷', hint: '豬'},
        {id: 'e7', word: 'cow', emoji: '🐮', hint: '牛'},
        {id: 'e8', word: 'bug', emoji: '🐛', hint: '蟲'},
        {id: 'e9', word: 'hat', emoji: '🎩', hint: '帽子'},
        {id: 'e10', word: 'apple', emoji: '🍎', hint: '蘋果'},
      ],
      medium: [
        {id: 'm1', word: 'tiger', emoji: '🐯', hint: '老虎'},
        {id: 'm2', word: 'panda', emoji: '🐼', hint: '熊貓'},
        {id: 'm3', word: 'plane', emoji: '✈️', hint: '飛機'},
        {id: 'm4', word: 'train', emoji: '🚂', hint: '火車'},
        {id: 'm5', word: 'house', emoji: '🏠', hint: '房子'},
        {id: 'm6', word: 'mouse', emoji: '🐭', hint: '老鼠'},
        {id: 'm7', word: 'snake', emoji: '🐍', hint: '蛇'},
        {id: 'm8', word: 'bread', emoji: '🍞', hint: '麵包'},
        {id: 'm9', word: 'candy', emoji: '🍬', hint: '糖果'},
        {id: 'm10', word: 'grape', emoji: '🍇', hint: '葡萄'},
      ],
      hard: [
        {id: 'h1', word: 'elephant', emoji: '🐘', hint: '大象'},
        {id: 'h2', word: 'dinosaur', emoji: '🦖', hint: '恐龍'},
        {id: 'h3', word: 'helicopter', emoji: '🚁', hint: '直升機'},
        {id: 'h4', word: 'crocodile', emoji: '🐊', hint: '鱷魚'},
        {id: 'h5', word: 'pineapple', emoji: '🍍', hint: '菠蘿'},
        {id: 'h6', word: 'strawberry', emoji: '🍓', hint: '草莓'},
        {id: 'h7', word: 'basketball', emoji: '🏀', hint: '籃球'},
        {id: 'h8', word: 'watermelon', emoji: '🍉', hint: '西瓜'},
        {id: 'h9', word: 'penguin', emoji: '🐧', hint: '企鵝'},
        {id: 'h10', word: 'butterfly', emoji: '🦋', hint: '蝴蝶'},
      ]
    };
    const LEVEL_TIME = {easy: 60, medium: 45, hard: 30};
    const LEVEL_LABEL = {easy: '簡單', medium: '中等', hard: '困難'};
    const RANK_EMOJI = ['🥇', '🥈', '🥉'];
    const CONFETTI_COLORS = ['#e8407a', '#fbbf24', '#34d399', '#818cf8', '#f472b6', '#60a5fa'];

    // ═══ STATE ═══
    const G = {
      playerName: '', level: 'easy', score: 0,
      timeRemaining: 60, timerId: null,
      currentWord: null, lastWordId: null,
      input: '', isLocked: false,
    };

    // ═══ SCREENS ═══
    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    // ═══ HOME ═══
    document.querySelectorAll('.level-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.level-btn').forEach(b => {
          b.className = 'level-btn';
        });
        G.level = btn.dataset.level;
        btn.classList.add('selected-' + G.level);
      });
    });

    document.getElementById('start-btn').addEventListener('click', () => {
      const n = document.getElementById('player-name').value.trim();
      const errEl = document.getElementById('name-error');
      if (!n) {errEl.textContent = 'Please enter your name! 請輸入你的名字！'; return;}
      errEl.textContent = '';
      G.playerName = n;
      startGame();
    });

    document.getElementById('view-lb-btn').addEventListener('click', () => {
      showScreen('screen-leaderboard');
      loadLeaderboard();
    });

    // ═══ GAME ═══
    function startGame() {
      G.score = 0; G.timeRemaining = LEVEL_TIME[G.level];
      G.lastWordId = null; G.input = ''; G.isLocked = false;
      showScreen('screen-game');
      updateScore(); updateTimer(); updateProgress(1);
      nextWord();
      startTimer();
      setTimeout(() => document.getElementById('hidden-input').focus(), 120);
    }

    function randomWord() {
      const pool = WORDS[G.level].filter(w => w.id !== G.lastWordId);
      return pool[Math.floor(Math.random() * pool.length)];
    }

    function nextWord() {
      G.currentWord = randomWord();
      G.lastWordId = G.currentWord.id;
      G.input = '';
      document.getElementById('hidden-input').value = '';
      renderWord();
    }

    function renderWord() {
      const {emoji, hint, word} = G.currentWord;
      document.getElementById('emoji-display').textContent = emoji;
      document.getElementById('hint-text').textContent = hint;

      const len = word.length;
      const sz = len <= 4 ? 'sz-lg' : len <= 6 ? 'sz-md' : len <= 8 ? 'sz-sm' : 'sz-xs';

      const container = document.getElementById('letters');
      container.innerHTML = '';
      word.split('').forEach((ch, i) => {
        const box = document.createElement('div');
        box.className = `letter-box ${sz}`;
        box.id = 'lb-' + i;
        box.textContent = ch;
        container.appendChild(box);
      });
    }

    function updateBoxes() {
      G.currentWord.word.split('').forEach((ch, i) => {
        const box = document.getElementById('lb-' + i);
        if (!box) return;
        const tc = G.input[i];
        box.classList.remove('correct', 'wrong');
        if (tc !== undefined) {
          box.textContent = tc;
          box.classList.add(tc === ch ? 'correct' : 'wrong');
        } else {
          box.textContent = ch;
        }
      });
    }

    // Keyboard capture
    document.getElementById('hidden-input').addEventListener('input', function () {
      if (G.isLocked) {this.value = G.input; return;}
      const val = this.value.toLowerCase();
      if (!G.currentWord) return;
      const word = G.currentWord.word.toLowerCase();
      const pos = val.length - 1;

      if (pos >= 0 && val[pos] !== word[pos]) {
        G.input = val;
        updateBoxes();
        doError();
        return;
      }
      G.input = val;
      updateBoxes();
      if (val === word) setTimeout(doSuccess, 300);
    });

    document.getElementById('game-card').addEventListener('click', () => {
      document.getElementById('hidden-input').focus();
    });

    function doError() {
      G.isLocked = true;
      const card = document.getElementById('game-card');
      card.classList.add('anim-error');
      setTimeout(() => {
        card.classList.remove('anim-error');
        G.input = ''; G.isLocked = false;
        document.getElementById('hidden-input').value = '';
        updateBoxes();
        document.getElementById('hidden-input').focus();
      }, 500);
    }

    function doSuccess() {
      G.isLocked = true;
      G.score += 10; updateScore();
      const card = document.getElementById('game-card');
      card.classList.add('anim-success');
      spawnConfetti(20);
      setTimeout(() => {
        card.classList.remove('anim-success');
        G.isLocked = false;
        nextWord();
        document.getElementById('hidden-input').focus();
      }, 480);
    }

    // Timer
    function startTimer() {
      clearInterval(G.timerId);
      G.timerId = setInterval(() => {
        G.timeRemaining--;
        updateTimer(); updateProgress(G.timeRemaining / LEVEL_TIME[G.level]);
        if (G.timeRemaining <= 0) {clearInterval(G.timerId); endGame();}
      }, 1000);
    }
    function endGame() {G.isLocked = true; showResults(); submitScore();}
    function updateScore() {document.getElementById('score-display').textContent = G.score;}
    function updateTimer() {
      document.getElementById('time-left').textContent = G.timeRemaining;
      document.getElementById('hud-timer').classList.toggle('low', G.timeRemaining <= 10);
    }
    function updateProgress(ratio) {
      const bar = document.getElementById('progress-bar');
      bar.style.width = (ratio * 100) + '%';
      bar.classList.toggle('low', ratio <= 0.25);
    }

    // ═══ RESULTS ═══
    function showResults() {
      document.getElementById('final-score').textContent = G.score;
      document.getElementById('results-name-msg').textContent = `Great job, ${G.playerName}!`;
      showScreen('screen-results');
      spawnConfetti(60);
    }
    async function submitScore() {
      try {
        await fetch('/api/game/scores', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({playerName: G.playerName, score: G.score, level: G.level})
        });
      } catch (e) { }
    }

    document.getElementById('play-again-btn').addEventListener('click', () => {
      showScreen('screen-home');
      document.getElementById('player-name').value = G.playerName;
    });
    document.getElementById('result-home-btn').addEventListener('click', () => {
      showScreen('screen-home');
      document.getElementById('player-name').value = G.playerName;
    });
    document.getElementById('result-lb-btn').addEventListener('click', () => {
      showScreen('screen-leaderboard'); loadLeaderboard();
    });

    // ═══ LEADERBOARD ═══
    async function loadLeaderboard() {
      const list = document.getElementById('lb-list');
      list.innerHTML = '<li class="loading-text">載入中...</li>';
      try {
        const res = await fetch('/api/game/scores');
        const scores = await res.json();
        if (!scores.length) {list.innerHTML = '<li class="loading-text">還沒有記錄！快去玩！</li>'; return;}
        list.innerHTML = scores.map((s, i) => `
      <li class="lb-item">
        <span class="lb-rank">${RANK_EMOJI[i] || (i + 1) + '.'}</span>
        <span class="lb-name">${esc(s.playerName)}</span>
        <span class="lb-level lv-${s.level}">${LEVEL_LABEL[s.level] || s.level}</span>
        <span class="lb-score">⭐ ${s.score}</span>
      </li>`).join('');
      } catch (e) {list.innerHTML = '<li class="loading-text">無法載入</li>';}
    }
    function esc(s) {return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');}

    document.getElementById('back-from-lb-btn').addEventListener('click', () => showScreen('screen-home'));

    // ═══ CONFETTI ═══
    function spawnConfetti(count) {
      for (let i = 0; i < count; i++) {
        const el = document.createElement('div');
        el.className = 'confetti-piece';
        el.style.left = (10 + Math.random() * 80) + 'vw';
        el.style.top = '-20px';
        el.style.background = CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)];
        el.style.animationDelay = (Math.random() * .5) + 's';
        el.style.animationDuration = (.8 + Math.random() * .9) + 's';
        el.style.transform = `rotate(${Math.random() * 360}deg)`;
        el.style.width = (8 + Math.random() * 8) + 'px';
        el.style.height = (10 + Math.random() * 10) + 'px';
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 2000);
      }
    }
  </script>
</body>

</html>
