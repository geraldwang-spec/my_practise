<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <link href="/static/practise_folder/sidemenu.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Pacifico&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <script src="https://kit.fontawesome.com/9427a040dc.js" crossorigin="anonymous"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      list-style: none;
      font-family: "Noto Sans", sans-serif;
    }

    html,
    body {
      height: 100%;
    }

    body {
      background-color: #546377;
    }

    .side-menu {
      position: relative;
      width: 300px;
      height: 100%;
      padding: 50px 0px;
      box-sizing: border-box;
      background-image: linear-gradient(29deg, rgba(42, 123, 155, 1) 0%, rgba(159, 63, 92, 1) 24%, rgba(87, 199, 133, 1) 50%, rgba(210, 146, 109, 1) 74%, rgba(237, 221, 83, 1) 100%);
      display: flex;
      flex-direction: column;
      box-shadow: 10px 0px 10px hsla(240, 40%, 10%, 0.6);
      transform: translateX(-100%);
      transition: 0.3s;
    }

    // .side-menu form {
    //   display: flex;
    //   margin: 0px 10px 50px;
    //   border-radius: 100px;
    //   border: 1px solid #fff;
    // }

    // .side-menu form input {
    //   border: none;
    //   background-color: transparent;
    //   padding: 5px 10px;
    //   width: 230px;
    //   color: #fff;
    // }

    // .side-menu form button {
    //   border: none;
    //   background-color: transparent;
    //   padding: 5px 10px;
    //   width: 50px;
    //   color: #fff;
    // }


    .side-menu form {
      display: flex;
      margin: 0px 10px 50px;
      border-radius: 100px;
      border: 1px solid rgb(255, 255, 255, 0.4);
    }

    .side-menu form input,
    .side-menu form button {
      border: none;
      background-color: transparent;
      padding: 5px 10px;
      color: #fff;
    }

    .side-menu form input {
      width: 230px;
    }

    .side-menu form button {
      width: 50px;
    }

    .side-menu form input:focus {
      outline: none;
    }

    .side-menu form:focus-within {
      border: 1px solid #ffcc00;
      box-shadow: 0px 0px 10px gray;
      border-radius: 100px;
    }

    .side-menu form:hover {
      box-shadow: 0px 0px 10px gray;
      border-radius: 100px;
    }

    .side-menu form input::placeholder {
      color: #fff;
    }

    .side-menu label {
      position: absolute;
      width: 40px;
      height: 80px;
      background-color: #000;
      color: #fff;
      top: 0;
      bottom: 0;
      margin: auto;
      right: -40px;
      line-height: 80px;
      text-align: center;
      font-size: 30px;
      border-radius: 0 10px 10px 0;
    }

    #side-menu-switch {
      position: absolute;
      opacity: 0;
      z-index: -1;
    }

    #side-menu-switch:checked+.side-menu {
      transform: translateX(0);
    }

    #side-menu-switch:checked+.side-menu label .fa-solid {
      transform: scaleX(-1);
    }

    nav a {
      display: block;
      padding: 10px;
      color: #fff;
      text-decoration: none;
      position: relative;
    }

    nav a+a::before {
      position: absolute;
      content: "";
      border-top: 1px solid rgb(255, 255, 255, 0.4);
      ;
      left: 10px;
      right: 10px;
      top: 0px;
    }

    nav a .fa {
      margin-right: -1.1em;
      transform: scale(0);
      transition: 0.3s;
    }

    nav a:hover .fa {
      margin-right: 0em;
      transform: scale(1);
      transition: 0.3s;
    }

    //#side-menu-switch {}
  </style>
</head>

<body>
  <input type="checkbox" name="" id="side-menu-switch">
  <div class="side-menu">
    <form>
      <input type="search" placeholder="請輸入關鍵字">
      <button type="button">
        <i class="fa-solid fa-magnifying-glass"></i>
      </button>
    </form>
    <nav>
      <a href="#"><i class="fa fa-solid fa-house"></i> test01</a>
      <a href="#"><i class="fa fa-solid fa-dumbbell"></i> test01</a>
      <a href="#"><i class="fa fa-solid fa-dumbbell"></i> test01</a>
      <a href="#"><i class="fa fa-regular fa-face-grin-tears"></i> test01</a>
      <a href="#"><i class="fa fa-solid fa-bed"></i> test01</a>
    </nav>
    <label for="side-menu-switch">
      <i class="fa-solid fa-angle-right"></i>
    </label>
  </div>
</body>

</html>
